name: PowerShell tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-powershell:
    name: Pester (Windows PowerShell 5.1)
    runs-on: windows-2025

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Parse scripts and run Pester
        shell: powershell
        run: |
          Import-Module Pester -RequiredVersion 3.4.0 -Force

          $parseErrors = @()
          Get-ChildItem -LiteralPath .\scripts -Filter '*.ps1' -File | ForEach-Object {
              $tokens = $null
              $errors = $null
              [System.Management.Automation.Language.Parser]::ParseFile(
                  $_.FullName,
                  [ref] $tokens,
                  [ref] $errors
              ) | Out-Null
              $parseErrors += @($errors)
          }
          if ($parseErrors.Count -gt 0) {
              $parseErrors | Format-List
              exit 1
          }

          $result = Invoke-Pester -Script .\tests -PassThru
          if ($result.FailedCount -gt 0) { exit 1 }

  powershell:
    name: Pester (PowerShell 7)
    runs-on: windows-2025

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Parse scripts and run Pester
        shell: pwsh
        run: |
          Import-Module Pester -RequiredVersion 3.4.0 -Force

          $parseErrors = @()
          Get-ChildItem -LiteralPath .\scripts -Filter '*.ps1' -File | ForEach-Object {
              $tokens = $null
              $errors = $null
              [System.Management.Automation.Language.Parser]::ParseFile(
                  $_.FullName,
                  [ref] $tokens,
                  [ref] $errors
              ) | Out-Null
              $parseErrors += @($errors)
          }
          if ($parseErrors.Count -gt 0) {
              $parseErrors | Format-List
              exit 1
          }

          $result = Invoke-Pester -Script .\tests -PassThru
          if ($result.FailedCount -gt 0) { exit 1 }
